[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DLV_CONF_SKIP
lib_deps =
    lvgl/lvgl @ ^9.0.0
    bodmer/TFT_eSPI @ ^2.5.31
    ; Add device-specific libraries only after hardware review.
